AdvSceneSwitcher.tempVar.twitch.id.goal="معرّف الهدف"
AdvSceneSwitcher.tempVar.twitch.type.goal="نوع الهدف"
AdvSceneSwitcher.tempVar.twitch.type.goal.description="نوع الهدف. القيم الممكنة هي:\n    follow — الهدف هو زيادة المتابعين.\n    subscription — الهدف هو زيادة الاشتراكات. يُظهر هذا النوع صافي الزيادة أو النقصان في نقاط المستويات المرتبطة بالاشتراكات.\n    subscription_count — الهدف هو زيادة الاشتراكات. يُظهر هذا النوع صافي الزيادة أو النقصان في عدد الاشتراكات.\n    new_subscription — الهدف هو زيادة الاشتراكات. يُظهر هذا النوع صافي الزيادة فقط في نقاط المستويات المرتبطة بالاشتراكات (ولا يحتسب المستخدمين الذين ألغوا اشتراكهم منذ بدء الهدف).\n    new_subscription_count — الهدف هو زيادة الاشتراكات. يُظهر هذا النوع صافي الزيادة فقط في عدد الاشتراكات (ولا يحتسب المستخدمين الذين ألغوا اشتراكهم منذ بدء الهدف)."
AdvSceneSwitcher.tempVar.twitch.description.goal="وصف الهدف"
AdvSceneSwitcher.tempVar.twitch.description.goal.description="وصف الهدف، إن وُجد. يمكن أن يحتوي الوصف على 40 حرفًا كحد أقصى."
AdvSceneSwitcher.tempVar.twitch.is_achieved.goal="تم تحقيق الهدف"
AdvSceneSwitcher.tempVar.twitch.is_achieved.goal.description="قيمة منطقية تشير إلى ما إذا كان المذيع قد حقق هدفه. تكون true إذا تحقق الهدف، وإلا فتكون false."
AdvSceneSwitcher.tempVar.twitch.current_amount.goal="المقدار الحالي للهدف"
AdvSceneSwitcher.tempVar.twitch.current_amount.goal.description="القيمة الحالية للهدف.\nيحدد نوع الهدف كيفية زيادة هذه القيمة أو نقصانها.\n    إذا كان النوع follow، تُضبط هذه القيمة على العدد الحالي لمتابعي المذيع. يزداد هذا العدد مع المتابعين الجدد وينقص عندما يلغي المستخدمون متابعة المذيع.\n    إذا كان النوع subscription، تزداد هذه القيمة وتنقص بمقدار النقاط المرتبطة بمستوى الاشتراك. على سبيل المثال، إذا كان اشتراك المستوى الثاني يساوي نقطتين، تزداد هذه القيمة أو تنقص بمقدار 2 وليس 1.\n    إذا كان النوع subscription_count، تزداد هذه القيمة بمقدار 1 لكل اشتراك جديد وتنقص بمقدار 1 لكل مستخدم يلغي اشتراكه.\n    إذا كان النوع new_subscription، تزداد هذه القيمة بمقدار النقاط المرتبطة بمستوى الاشتراك. على سبيل المثال، إذا كان اشتراك المستوى الثاني يساوي نقطتين، تزداد هذه القيمة بمقدار 2 وليس 1.\n    إذا كان النوع new_subscription_count، تزداد هذه القيمة بمقدار 1 لكل اشتراك جديد."
AdvSceneSwitcher.tempVar.twitch.target_amount.goal="المقدار المستهدف للهدف"
AdvSceneSwitcher.tempVar.twitch.target_amount.goal.description="القيمة المستهدفة للهدف. على سبيل المثال، إذا كان لدى المذيع 200 متابع قبل إنشاء الهدف، وكان هدفه مضاعفة هذا العدد، تُضبط هذه القيمة على 400."
