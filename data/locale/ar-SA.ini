AdvSceneSwitcher.macroTab.checkInParallel.tooltip="إذا لم يكن هذا الخيار مُمكَّنًا، فستُقيَّم شروط هذا الماكرو بعد اكتمال التحقق من شروط الماكرو السابق.\nفإذا كانت هناك ثلاث وحدات ماكرو - الماكرو A والماكرو B والماكرو C - في قائمة الماكرو، فسيكون ترتيب تقييم الشروط كالتالي:\n • شروط الماكرو A\n • شروط الماكرو B\n • شروط الماكرو C\nأما إذا كان هذا الخيار مُمكَّنًا، فقد يختلف الترتيب.\nقد يكون تمكين هذا الخيار مفيدًا عندما تكون لديك عدة عمليات تحقق من الشروط تستغرق وقتًا طويلًا ولا تريد أن تتسبب في \"حظر\" وحدات الماكرو الأخرى."
