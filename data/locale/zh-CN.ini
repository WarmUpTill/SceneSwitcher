AdvSceneSwitcher.sceneGroupTab.help="场景组可以像普通场景一样被选为目标。\n\n顾名思义，场景组是多个场景的集合。\n场景组会根据右侧配置的设置，在其分配的场景列表中依次切换。\n\n可配置场景组按以下方式切换到列表中的下一个场景：\n被选为目标一定次数后。\n经过一定时间后。\n或随机切换。\n\n例如，一个包含以下场景的场景组……\n场景 1\n场景 2\n场景 3\n……首次被选为目标时将激活\"场景 1\"。\n第二次被选为目标时将激活\"场景 2\"。\n之后的次数将激活\"场景 3\"。\n\n点击下方高亮的加号添加新的场景组。"
AdvSceneSwitcher.sceneGroupTab.scenes.help="在左侧选择要修改的场景组。\n\n在上方选择要添加到此场景组的场景，然后点击下方的加号。\n\n同一个场景可以多次添加到同一个场景组中。"
