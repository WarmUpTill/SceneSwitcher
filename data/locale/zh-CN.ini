AdvSceneSwitcher.tempVar.twitch.id.goal="目标 ID"
AdvSceneSwitcher.tempVar.twitch.type.goal="目标类型"
AdvSceneSwitcher.tempVar.twitch.type.goal.description="目标的类型。可能的值：\n  follow — 目标为增加粉丝。\n  subscription — 目标为增加订阅。此类型显示订阅相关等级积分的净增减。\n  subscription_count — 目标为增加订阅。此类型显示订阅数量的净增减。\n  new_subscription — 目标为增加订阅。此类型仅显示订阅相关等级积分的净增加（不计算目标开始后取消订阅的用户）。\n  new_subscription_count — 目标为增加订阅。此类型仅显示订阅数量的净增加（不计算目标开始后取消订阅的用户）。"
AdvSceneSwitcher.tempVar.twitch.description.goal="目标描述"
AdvSceneSwitcher.tempVar.twitch.description.goal.description="目标的描述（如有指定）。描述最多可包含 40 个字符。"
AdvSceneSwitcher.tempVar.twitch.is_achieved.goal="目标已达成"
AdvSceneSwitcher.tempVar.twitch.is_achieved.goal.description="表示主播是否达成其目标的布尔值。目标达成时为 true，否则为 false。"
AdvSceneSwitcher.tempVar.twitch.current_amount.goal="目标当前值"
AdvSceneSwitcher.tempVar.twitch.current_amount.goal.description="目标的当前值。\n目标的类型决定了此值如何增减。\n    如果类型为 follow，此字段设为主播当前的粉丝数。该数字随新粉丝增加，随用户取关而减少。\n    如果类型为 subscription，此字段按订阅等级对应的积分值增减。例如，如果二级订阅价值 2 积分，此字段增减 2 而非 1。\n    如果类型为 subscription_count，此字段每新增一个订阅加 1，每取消一个订阅减 1。\n    如果类型为 new_subscription，此字段按订阅等级对应的积分值增加。例如，如果二级订阅价值 2 积分，此字段增加 2 而非 1。\n    如果类型为 new_subscription_count，此字段每新增一个订阅加 1。"
AdvSceneSwitcher.tempVar.twitch.target_amount.goal="目标值"
AdvSceneSwitcher.tempVar.twitch.target_amount.goal.description="目标的期望值。例如，如果主播在创建目标前有 200 名粉丝，目标是将其翻倍，则此字段设为 400。"
